[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-kit"
version = "0.3.0"
description = "Build emotion-aware AI agents, adaptive episodic memory, SQL AI, RAG, tools, and Gemini-powered agent systems."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shashank Singh", email = "shashank14581@gmail.com" }]
keywords = [
    "agentic-ai",
    "ai-agents",
    "emotion-aware-agents",
    "episodic-memory",
    "adaptive-memory",
    "identity-conditioned-memory",
    "sql-ai",
    "gemini",
    "rag",
    "mcp",
    "multi-agent",
    "reinforcement-learning",
    "tree-attention",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "google-genai>=2.19.0,<3.0.0",
    "requests>=2.31.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "sqlglot>=25.0.0",
    "PyYAML>=6.0.1",
    "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "build", "twine"]

[project.urls]
Homepage = "https://sites.google.com/view/agentic-ai-kit/"
Documentation = "https://shashank14581.github.io/agentic-ai-kit/"
Repository = "https://github.com/shashank14581/agentic-ai-kit"
Issues = "https://github.com/shashank14581/agentic-ai-kit/issues"
Changelog = "https://github.com/shashank14581/agentic-ai-kit/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentic_ai*"]

[tool.setuptools.package-data]
"agentic_ai" = ["py.typed"]
